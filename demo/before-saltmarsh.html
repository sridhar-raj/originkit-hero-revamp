<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@200;300;500&display=block">
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Raleway,sans-serif;color:#fff;background:#577f86}
  header{position:fixed;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:22px 5vw}
  header b{font-weight:300;font-size:20px;letter-spacing:.35em;text-transform:uppercase}
  .burger{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;cursor:pointer}
  .burger span{display:block;width:26px;height:1px;background:#fff;box-shadow:0 -8px 0 #fff,0 8px 0 #fff}
  .hero{position:relative;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:0 24px}
  .hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
  h1{font-weight:200;font-size:clamp(34px,5vw,72px);letter-spacing:.06em;line-height:1.2;margin:0;text-transform:uppercase}
  p{font-weight:300;font-size:17px;line-height:1.8;max-width:620px;margin:20px auto 34px;color:rgba(255,255,255,.75)}
  .cta{color:#fff;text-decoration:none;font-size:11px;letter-spacing:.4em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:6px}
  .down{position:absolute;bottom:28px;left:50%;width:14px;height:14px;border-right:1px solid #fff;border-bottom:1px solid #fff;transform:translateX(-50%) rotate(45deg);animation:b 1.6s infinite}
  @keyframes b{50%{bottom:18px}}
</style><title>Saltmarsh Sailing (before)</title></head><body>
<header><b>Saltmarsh</b><button class="burger" aria-label="Menu"><span></span></button></header>
<section class="hero"><video src="assets/before-saltmarsh-sea.mp4" autoplay muted loop playsinline></video>
<h1>Discover the freedom<br>of the open sea</h1>
<p>Experience unforgettable moments on the water with our passionate team of professionals, whatever your level or ambition.</p>
<a class="cta" href="#">Explore</a><span class="down"></span></section>
</body></html>
