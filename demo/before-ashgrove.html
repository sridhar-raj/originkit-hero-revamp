<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=block">
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Lato,sans-serif;color:#fff;background:#3b2a1e}
  header{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:26px 5vw}
  header .logo{font-family:"Playfair Display",serif;font-size:24px;letter-spacing:.06em}
  header nav a{color:#fff;text-decoration:none;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-left:26px;opacity:.9}
  .hero{position:relative;height:100vh;min-height:620px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
  .hero::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.14);z-index:-1}
  .inner{max-width:820px;padding:0 24px}
  .kicker{font-size:13px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:18px}
  h1{font-family:"Playfair Display",serif;font-weight:400;font-size:clamp(34px,4.6vw,64px);line-height:1.15;margin:0}
  h1 em{font-style:italic}
  p{font-weight:300;font-size:19px;line-height:1.7;margin:22px auto 36px;max-width:640px}
  .ghost{display:inline-block;border:1px solid rgba(255,255,255,.8);color:#fff;text-decoration:none;padding:12px 30px;font-size:12px;letter-spacing:.25em;text-transform:uppercase}
  .dots{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
  .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)} .dots i:first-child{background:#fff}
  @media (max-width:760px){header nav{display:none}}
</style><title>Ashgrove (before)</title></head><body>
<header><span class="logo">ASHGROVE</span><nav><a href="#">Home</a><a href="#">About</a><a href="#">Classes</a><a href="#">Gallery</a><a href="#">Membership</a><a href="#">Contact</a></nav></header>
<section class="hero"><img src="assets/before-ashgrove-wheel.jpg" loading="lazy" alt="">
<div class="inner"><div class="kicker">Welcome to our studio</div>
<h1>Where <em>creativity</em> meets clay</h1>
<p>A warm and welcoming community space for makers of every level, offering a wide range of facilities and services to help you bring your ideas to life.</p>
<a class="ghost" href="#">Discover more</a></div>
<div class="dots"><i></i><i></i><i></i></div></section>
</body></html>
