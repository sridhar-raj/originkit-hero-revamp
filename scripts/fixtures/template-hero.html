<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>template hero</title>
<!-- The usual template hero: every new check in hero-audit.mjs should trip on it. -->
<style>
  @font-face{font-family:"Display";src:url(slow/display-latin.woff2) format("woff2");font-weight:400 800;font-display:block}
  body{margin:0;font:16px/1.5 Arial,sans-serif;background:#fff;color:#0f0f1a}
  .hero{position:relative;text-align:center;padding:96px 24px 0;overflow:visible}
  .hero::before{content:"";position:absolute;inset:0 0 auto 0;height:640px;z-index:-1;background:radial-gradient(ellipse at 50% 0%,rgba(99,102,241,.6),rgba(168,85,247,.3) 45%,transparent 75%);filter:blur(10px)}
  .pill{display:inline-block;padding:5px 14px;border:1px solid rgba(99,102,241,.35);border-radius:999px;background:rgba(99,102,241,.08);color:#4338ca;font-size:13px;text-decoration:none}
  h1{font-family:"Display",Arial,sans-serif;font-size:64px;line-height:1.1;letter-spacing:-.02em;margin:20px auto 0;max-width:1100px}
  .grad{background:linear-gradient(90deg,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{max-width:36rem;margin:20px auto 32px;color:#4b5563;font-size:18px}
  .btn{display:inline-block;box-sizing:border-box;width:170px;padding:12px 10px;margin:0 6px;border-radius:10px;font:600 15px Arial,sans-serif;text-decoration:none;vertical-align:top}
  .fill{background:#4f46e5;color:#fff}
  .line{border:1px solid #c7c9d1;color:#111}
  a:focus,button:focus{outline:none}
  .play{width:44px;height:44px;margin-left:6px;border:0;border-radius:50%;background:#eef;vertical-align:top;padding:12px}
  .proof{display:flex;align-items:center;justify-content:center;gap:8px;margin:24px 0 0;color:#6b7280;font-size:14px}
  .proof img{width:28px;height:28px;border-radius:50%;object-fit:cover}
  .trusted{margin:28px 0 10px;color:#9ca3af;font-size:13px}
  .logos{display:flex;justify-content:center;gap:56px;white-space:nowrap;opacity:.5;color:#6b7280;font:700 20px Arial,sans-serif}
  .shot{display:block;width:min(900px,92vw);height:auto;margin:150px auto 0;border-radius:12px;box-shadow:0 30px 80px rgba(79,70,229,.25)}
  @media (max-width:600px){h1{font-size:34px}.btn{width:128px}.shot{margin-top:260px}}
</style></head><body>
<section class="hero">
  <a class="pill" href="#news">✨ New: AI workflows are here →</a>
  <h1>Supercharge your workflow with<br><span class="grad">AI</span></h1>
  <p class="sub">Streamline your processes, boost productivity and unlock insights with our all-in-one platform built for modern teams.</p>
  <div><a class="btn fill" href="#start">Get started free</a><a class="btn line" href="#more">Learn more</a><button class="play"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M5 3l12 7-12 7z" fill="#4f46e5"/></svg></button></div>
  <div class="proof"><img src="product-700.webp" srcset="product-700.webp 700w" alt=""><img src="product-700.webp" srcset="product-700.webp 700w" alt=""><img src="product-700.webp" srcset="product-700.webp 700w" alt=""><span>Loved by 10,000+ teams</span></div>
  <p class="trusted">Trusted by teams at</p>
  <div class="logos"><span>Acme</span><span>Globex</span><span>Initech</span><span>Umbrella</span><span>Hooli</span></div>
  <img class="shot" src="product-700.webp" width="700" height="438" alt="The dashboard">
</section>
<script>
  // a JavaScript intro animation that does too much work per frame
  addEventListener("load", () => {
    const shot = document.querySelector(".shot"), end = performance.now() + 1500;
    const step = () => { const t = performance.now(); while (performance.now() - t < 60) {} shot.style.transform = `translateY(${Math.round((end - t) / 100)}px)`; if (t < end) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
</script>
</body></html>
