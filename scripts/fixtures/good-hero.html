<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>good hero</title>
<style>
  body{margin:0;font:18px/1.55 Arial,sans-serif;background:#0d0f14;color:#f4f5f7}
  .hero{min-height:100svh;display:grid;grid-template-columns:1fr 1.15fr;align-items:center;gap:48px;padding:0 6vw;box-sizing:border-box}
  h1{font-size:clamp(40px,6vw,76px);line-height:1.02;letter-spacing:-0.03em;margin:0;text-wrap:balance}
  p{color:#c9ccd3;max-width:36rem;margin:20px 0 28px}
  .cta{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:10px;background:#f4f5f7;color:#0d0f14;font-weight:700;text-decoration:none;white-space:nowrap}
  .ghost{display:inline-flex;align-items:center;min-height:48px;padding:0 18px;margin-left:12px;border:1px solid #444;border-radius:10px;color:#f4f5f7;text-decoration:none;white-space:nowrap}
  .cta:focus-visible,.ghost:focus-visible{outline:2px solid #8ab4ff;outline-offset:3px}
  img{width:100%;height:auto;border-radius:14px}
  @media (max-width:760px){.hero{grid-template-columns:1fr;padding:32px 20px;gap:28px}}
</style></head><body>
<main>
<section class="hero">
  <div>
    <h1>Invoices that chase themselves.</h1>
    <p>Ledgerly sends, tracks and follows up on every invoice for freelancers, so you get paid in 9 days instead of 30.</p>
    <a class="cta" href="#start">Start free</a><a class="ghost" href="#tour">See how it works</a>
  </div>
  <img src="product.webp" srcset="product-700.webp 700w, product.webp 1200w" sizes="(max-width: 760px) 88vw, 50vw" width="1200" height="750" alt="Ledgerly's invoice list with three paid and one overdue invoice" fetchpriority="high">
</section>
</main>
</body></html>
